[project]
name = "ha-gude-pdu"
version = "0.1.0"
description = "Home Assistant custom integration for GUDE Systems Power Distribution Units (PDUs)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14.2"
authors = [
    { name = "David Ferguson" }
]
dependencies = []

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "homeassistant==2026.10.2",
    "mypy>=1.18.0",
    "pre-commit>=4.3.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-homeassistant-custom-component>=0.13.372",
    "ruff>=0.14.0",
    "syrupy>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=custom_components.gude_pdu --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components/gude_pdu"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "T20",    # flake8-print
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "D203",    # 1 blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password
    "S106",    # Possible hardcoded password assigned to argument
    "SLF001",  # Private member accessed
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.gude_pdu", "homeassistant"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
implicit_reexport = true
strict = true
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.codespell]
ignore-words-list = "gude,hass"
skip = ".git,.venv,__pycache__,*.ambr"

