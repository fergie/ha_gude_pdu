default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --unsafe
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: pretty-format-json
        args:
          - --autofix
          - --no-sort-keys
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy custom_components/gude_pdu tests
        language: system
        types: [python]
        pass_filenames: false
      - id: check-release-version
        name: check-release-version
        entry: uv run python -c
        language: system
        files: ^(custom_components/gude_pdu/manifest\.json|pyproject\.toml)$
        pass_filenames: false
        args:
          - |
            import json
            from pathlib import Path
            import re
            import sys
            import tomllib

            semver_re = re.compile(
                r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
                r"(?:(?:-|\.)?(?:a|b|rc|alpha|beta|dev)\d*(?:\.\d+)?)?$"
            )

            manifest = json.loads(
                Path("custom_components/gude_pdu/manifest.json").read_text()
            )
            manifest_version = manifest.get("version")
            if not isinstance(manifest_version, str) or not semver_re.match(
                manifest_version
            ):
                sys.exit(
                    f"Error: manifest.json version '{manifest_version}' is not a valid semantic version."
                )

            pyproject = tomllib.loads(Path("pyproject.toml").read_text())
            pyproject_version = pyproject.get("project", {}).get("version")
            if not isinstance(pyproject_version, str) or not semver_re.match(
                pyproject_version
            ):
                sys.exit(
                    f"Error: pyproject.toml version '{pyproject_version}' is not a valid semantic version."
                )

            if manifest_version != pyproject_version:
                sys.exit(
                    f"Error: manifest.json version '{manifest_version}' does not match "
                    f"pyproject.toml version '{pyproject_version}'."
                )
